<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="24" viewBox="0 0 1200 24">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0D9488" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#0D9488" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="11" width="1200" height="2" rx="1" fill="url(#line)" opacity="0.7"/>
  <rect x="-260" y="11" width="260" height="2" rx="1" fill="url(#sweep)" opacity="0.8">
    <animate attributeName="x" from="-260" to="1200" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="12" r="3.5" fill="#14b8a6"/>
  <circle cx="600" cy="12" r="7" fill="none" stroke="#14b8a6" stroke-width="1" opacity="0.6">
    <animate attributeName="r" values="4;10" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;0" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
